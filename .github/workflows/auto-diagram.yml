name: Update Architecture Diagram

# Keeps the README architecture diagram in perpetual sync with the code.
# Deterministic output means this only ever commits when the architecture
# actually changed — no phantom diffs.

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.py'
      - '!tests/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyVisualizer
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Self-heal README architecture diagram
        run: |
          py-code-visualizer readme . --target README.md --detail module --exclude tests

      - name: Commit if the diagram changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Architecture diagram already up to date."
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add README.md
            git commit -m "🗺️ Auto-update architecture diagram [skip ci]"
            git push
          fi
