name: PR Architecture Review

# Builds the deterministic call graph for the base branch and the PR head,
# diffs them, and posts a report showing exactly what changed at the
# architecture level — including any newly introduced circular dependencies.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.py'

permissions:
  contents: read
  pull-requests: write

jobs:
  architecture-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyVisualizer
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Graph — base branch
        run: |
          git worktree add /tmp/base origin/${{ github.event.pull_request.base.ref }}
          py-code-visualizer json /tmp/base -o base.json --exclude tests examples

      - name: Graph — PR head
        run: |
          py-code-visualizer json . -o head.json --exclude tests examples

      - name: Architecture diff report
        id: diff
        run: |
          py-code-visualizer diff base.json head.json \
            --project-name "PR #${{ github.event.pull_request.number }}" \
            --output arch-report.md || true
          # Fail the check (but still comment) when new cycles appear:
          py-code-visualizer diff base.json head.json --fail-on-new-cycles --no-diagram \
            > /dev/null 2>&1 && echo "new_cycles=false" >> "$GITHUB_OUTPUT" \
            || echo "new_cycles=true" >> "$GITHUB_OUTPUT"

      - name: Post / update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('arch-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = 'Architecture Change Report';
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body });
            }

      - name: Fail on new circular dependencies
        if: steps.diff.outputs.new_cycles == 'true'
        run: |
          echo "::error::This PR introduces new circular dependencies. See the PR comment."
          exit 1

      - name: Upload graph artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-graphs-pr-${{ github.event.pull_request.number }}
          path: |
            base.json
            head.json
            arch-report.md
          retention-days: 14
