<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <style>
      .win { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .bar { fill: #161b22; }
      text { font-size: 15px; }
      .prompt { fill: #7c3aed; }
      .cmd { fill: #e6edf3; }
      .ok { fill: #3fb950; }
      .info { fill: #58a6ff; }
      .muted { fill: #8b949e; }
      .grade { fill: #3fb950; font-weight: bold; }
      .l { opacity: 0; }
      @keyframes show { to { opacity: 1; } }
      .l1 { animation: show .01s linear 0.4s forwards; }
      .l2 { animation: show .01s linear 1.6s forwards; }
      .l3 { animation: show .01s linear 2.4s forwards; }
      .l4 { animation: show .01s linear 3.6s forwards; }
      .l5 { animation: show .01s linear 4.2s forwards; }
      .l6 { animation: show .01s linear 4.8s forwards; }
      .l7 { animation: show .01s linear 5.4s forwards; }
      .l8 { animation: show .01s linear 6.2s forwards; }
      @keyframes blink { 50% { opacity: 0; } }
      .cursor { fill: #7c3aed; animation: blink 1s step-end infinite; }
    </style>
  </defs>

  <rect class="win" x="1" y="1" width="758" height="398" rx="12"/>
  <rect class="bar" x="1" y="1" width="758" height="34" rx="12"/>
  <rect class="bar" x="1" y="22" width="758" height="13"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="380" y="23" text-anchor="middle" class="muted" font-size="12">py-code-visualizer — deterministic architecture</text>

  <g transform="translate(24, 70)">
    <text class="l l1"><tspan class="prompt">$ </tspan><tspan class="cmd">pip install py-code-visualizer</tspan></text>
    <text y="30" class="l l2"><tspan class="prompt">$ </tspan><tspan class="cmd">py-code-visualizer visualize . -o architecture.html</tspan></text>
    <text y="60" class="l l3 muted">Analyzing project structure (AST — no code executed)…</text>
    <text y="84" class="l l4"><tspan class="info">✓</tspan><tspan class="cmd"> Built graph: 210 functions · 256 calls · 0 cycles</tspan></text>
    <text y="108" class="l l5"><tspan class="cmd">  Every edge traceable to a </tspan><tspan class="info">file:line</tspan><tspan class="cmd">. Output is deterministic.</tspan></text>
    <text y="132" class="l l6"><tspan class="cmd">  Architecture Health: </tspan><tspan class="grade">A- (91/100)</tspan></text>
    <text y="156" class="l l7"><tspan class="ok">→ architecture.html</tspan><tspan class="muted"> (self-contained · works offline)</tspan></text>
    <text y="200" class="l l8"><tspan class="prompt">$ </tspan><tspan class="cursor">▋</tspan></text>
  </g>
</svg>
